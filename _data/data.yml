projects:
  title: Selected work
  intro: "Research methods and computational studies."
  assignments:
    - title: Bayesian latent-severity modeling
      link: https://github.com/minjee-kim/Bayesian-latent-severity-LCA
      image: https://raw.githubusercontent.com/minjee-kim/Bayesian-latent-severity-LCA/main/figures/Vij_plot.png
      image_alt: "Latent diagnostic-test scores and disease-severity model schematic"
      tagline: "Bayesian model for estimating diagnostic accuracy and prevalence without a gold standard, incorporating continuous latent severity. Studied identifiability and model behavior using MCMC, parameter-recovery simulations, and a Strongyloides reanalysis."

    - title: FLOCK — Monte Carlo exploration
      link: https://github.com/minjee-kim/FLOCK
      image: https://raw.githubusercontent.com/minjee-kim/FLOCK/main/figures/geometric_search.svg
      image_alt: "FLOCK geometric search visualization"
      tagline: "Exploratory comparison of coordinated proposal strategies for difficult posterior distributions. Benchmarks showed occasional improvements, but no consistent advantage over conventional methods."
      paper: https://github.com/minjee-kim/FLOCK/blob/main/paper/main.pdf

    - title: "Financial forecasting — statistical vs. ML models"
      link: https://github.com/minjee-kim/financial-forecasting
      image: https://raw.githubusercontent.com/minjee-kim/financial-forecasting/main/figures/validation_oos_r2.svg
      image_alt: "Out-of-sample R-squared comparison across statistical and machine-learning models on the validation period"
      tagline: "Compared statistical benchmarks, linear and regularized regression, and tree-based ML for next-day SPY ETF log-return prediction. On the 2020–2023 validation period, Ridge achieved an out-of-sample R-squared of 0.001; more complex models offered no meaningful improvement over the simple average."
