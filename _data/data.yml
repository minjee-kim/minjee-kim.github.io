projects:
  title: Dissertation and selected work
  intro: >
    Two chapters, one target. Chapter I asks when prevalence and diagnostic accuracy
    are identified from imperfect tests and heterogeneous designs, and how to estimate
    them. Chapter II treats cost burden as a posterior functional of that model,
    not as prevalence times a constant.

  assignments:
    - title: "I. Identifiability of prevalence without a gold standard"
      tagline: >
        Target: prevalence and test accuracy when true status is never observed
        and studies use different tests and designs. Standard latent-class models
        can be unidentified, or identified only under assumptions the design does
        not support. I use rank, null-space, and design-structure arguments to
        mark when parameters are uniquely recoverable, then build Bayesian
        latent-class and latent-severity models on the designs that support them.
        Check: parameter-recovery simulations; explicit statement of what remains
        unidentified under sparse or single-test designs. Status: in progress.

    - title: Bayesian latent-severity model
      link: https://github.com/minjee-kim/Bayesian-latent-severity-LCA
      tagline: >
        Continuous latent severity for diseased units, relaxing conditional
        independence in classical LCA. MCMC with data augmentation; comparison
        of conditional-independence, gamma-severity, and nonlocal-prior severity
        specifications; recovery study and application to an existing diagnostic
        panel. Code: model, simulation, and case-study scripts.

    - title: "II. Cost burden as a posterior functional"
      tagline: >
        Target: not a point prevalence. A distribution over economic loss
        L = f(prevalence, population, unit costs). I push the Chapter I posterior
        through f together with uncertainty in livestock populations and economic
        inputs, and decompose which source moves the tail of L. Check: sensitivity
        to the loss specification and to regions where Chapter I is weakly
        identified. Status: in progress.

    - title: A/B testing and experimental design
      link: https://github.com/minjee-kim/ab-testing
      tagline: >
        Separate from the dissertation. Randomized experiments: metric definition,
        power and sample size, treatment-effect estimation, uncertainty, and
        diagnostics.

