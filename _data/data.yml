career-profile:
  title: Overview
  summary: |
    I am a PhD student in Statistics at Texas A&M specializing in hierarchical modeling, uncertainty quantification, and model validation. 

    Check out our recent publication: [Bayesian disease modeling with latent class analysis](https://www.nature.com/articles/s41467-025-66515-z)

education:
  title: Education
  info:
    - degree: PhD Statistics (Expected May 2027)
      university: "Texas A&M University"
      time: 2022 - Present
      details: |
        Research: Bayesian prevalence estimation, diagnostic test accuracy modeling,
        latent variable methods. Emphasis on applications in public health and
        epidemiology.

    - degree: MS Statistics
      university: "Texas A&M University"
      time: 2020 - 2022
      details: |
        Master's thesis: Trained convolutional neural networks with bottleneck
        architectures, developing a high-dimensional clustering framework that
        improved feature separation in complex datasets.

    - degree: BS Statistics
      university: "Texas A&M University"
      time: 2017 - 2020
      details: |
        Undergraduate research experiences:
          - Undergraduate Summer Research (2018), PI: Dr. Malini Natarajarathinam —
            applied text analysis to extract patterns in industrial distribution data.
          - Undergraduate Summer Research (2019), PIs: Dr. Shahina Rahman & Dr. Valen Johnson —
            developed high-dimensional clustering simulations for the RJClust R package,
            enabling scalability to large biological datasets.

experiences:
  title: Experience
  info:
    - role: Doctoral Researcher in Statistics
      time: 2022 - Present
      company: Texas A&M University
      details: |
        - Develop Bayesian hierarchical and latent-variable models for prevalence estimation and diagnostic testing without a gold standard.
        - Design simulation studies to evaluate identifiability, parameter recovery, robustness, and uncertainty quantification.
        - Develop a latent severity extension to reduce model complexity and improve estimation in sparse-data settings.
      
    - role: Instructor, STAT 211 - Principles of Statistics I
      time: Fall 2026
      company: Department of Statistics, Texas A&M University, College Station, TX
      details: |
        - Serve as instructor for an undergraduate introductory statistics course covering probability, statistical inference, hypothesis testing, and regression.
        - Teach students to perform exploratory and inferential statistical analyses using R and interpret results in real-world contexts.
        - Develop and deliver course materials, assessments, and statistical computing instruction for an asynchronous online course.
        
    - role: PhD Statistics and Data Science Internship
      time: Summer 2025
      company: Lubrizol Corporation, Wickliffe, OH 
      details: |
        - Developed and deployed credible intervals for predictive models, improving reliability of forecast.
        - Designed repeatability and reproducibility experiments, strengthening product validation.
        - Built predictive models linking chemical composition to transmission fluid performance to guide the data-driven product development decisions.
    - role: Biostatistics Research Assistant
      time: Aug 2021 – May 2023
      company: Institute of Biosciences and Technology, Texas A&M University (Dr. Kurt Zhang Lab), Houston, TX
      details: |
        - Applied high-dimensional regression and clustering methods to DNA methylation data,
          identifying biomarkers linked to disease pathways.
        - Analyzed NHANES data to evaluate dietary risk factors for hypertension in pregnancy,
          contributing to peer-reviewed publications.

projects:
  title: Projects
  intro: >
    Selected work in experimentation, causal inference, Bayesian modeling,
    and applied statistical analysis.

  assignments:

    - title: A/B Testing and Experimental Design
      link: "https://github.com/minjee-kim/ab-testing"
      tagline: >
        Analysis of randomized product experiments, including metric definition,
        power and sample size calculations, treatment-effect estimation,
        uncertainty quantification, and experiment diagnostics.

    - title: Double/Debiased Machine Learning for Causal Inference
      link: "https://github.com/minjee-kim/Double-Debiased-ML"
      tagline: >
        Applications of Double Machine Learning for causal effect estimation,
        including randomized trials with non-compliance and observational data
        with high-dimensional confounding.

    - title: Bayesian Latent Severity Modeling
      link: "https://github.com/minjee-kim/Bayesian-latent-severity-LCA"
      tagline: >
        Bayesian latent class modeling extended with a latent severity variable
        to reduce model complexity and improve estimation of disease prevalence
        and diagnostic test accuracy when data are limited and no gold standard
        test is available.

    - title: Geospatial Clustering
      link: "https://github.com/minjee-kim/New-York-Taxi-Cab-Demand-Analysis"
      tagline: >
        Geospatial analysis of New York City taxi trips to identify spatial
        and weekly patterns in passenger demand.

    - title: Zero-Inflated Negative Binomial Regression
      link: "/assets/files/ZeroInflated_NB_Model.pdf"
      tagline: >
        Modeling overdispersed and zero-inflated infection counts to identify
        important predictors and characterize variation in count outcomes.

