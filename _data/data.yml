projects:
  title: Projects
  intro: >
    Selected work in experimentation, causal inference, Bayesian modeling,
    and applied statistical analysis.

  assignments:

    - title: Identifiability in Latent-Variable Models
      tagline: >
        Theoretical and computational study of identifiability in latent-variable
        models under heterogeneous observation designs. Uses Jacobian rank,
        null-space analysis, and experimental-design structure to characterize
        when prevalence and diagnostic-accuracy parameters can be uniquely recovered.

    - title: Bayesian Latent Severity Modeling
      link: "https://github.com/minjee-kim/Bayesian-latent-severity-LCA"
      tagline: >
        Bayesian latent class modeling with a continuous latent severity variable
        for estimating disease prevalence and diagnostic test accuracy without a
        gold standard, with emphasis on model reduction, parameter recovery,
        and uncertainty quantification.

    - title: Hierarchical Global Prevalence Estimation
      tagline: >
        Bayesian hierarchical modeling of disease prevalence across studies,
        regions, and countries using heterogeneous diagnostic study designs,
        imperfect tests, and uncertainty in test accuracy.

    - title: Uncertainty Propagation for Global Economic Loss
      tagline: >
        Framework for propagating uncertainty in disease prevalence, livestock
        populations, and economic inputs to estimate country-level and global
        distributions of economic loss.

    - title: A/B Testing and Experimental Design
      link: "https://github.com/minjee-kim/ab-testing"
      tagline: >
        Analysis of randomized product experiments including metric definition,
        power and sample-size calculations, treatment-effect estimation,
        uncertainty quantification, and experiment diagnostics.

        
experiences:
