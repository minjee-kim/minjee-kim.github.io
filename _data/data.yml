career-profile:
  title: Research
  summary: |
    I work on statistical inference when the object of interest is latent and every measurement is noisy. The first problem is identification: under a given observation design, which parameters can be recovered at all. The second is estimation: Bayesian latent-variable and hierarchical models that respect that design, checked by simulation. The third is the quantity that is actually used — a decision functional of those parameters, with uncertainty carried through rather than collapsed to a point estimate.

    Dissertation, in progress, advised by Valen E. Johnson. Chapter I: identification and estimation of prevalence and diagnostic accuracy without a gold standard. Chapter II: propagate that posterior, together with uncertainty in population and economic inputs, to a distribution over disease cost burden.

    Application: diagnostic testing and disease burden. The inferential questions are not specific to that application.

